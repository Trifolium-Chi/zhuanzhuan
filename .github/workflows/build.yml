name: Build ZZMerge deb

# ===========================================================================
# 触发：推送到 main/master，或手动 Run workflow
#
# 【构建模式】rootful（默认），刻意不设 THEOS_PACKAGE_SCHEME。
#   依据：原版找鸡的 control 写着 Pre-Depends: rootless-compat，
#   安装路径为 /Library/MobileSubstrate/DynamicLibraries/ —— 它本身就是 rootful，
#   由 rootless-compat 在无根/RootHide 设备上做路径映射。照抄它最稳。
#   另：Theos 没有名为 "roothide" 的 scheme，设了会直接报错。
#
# 【工具链】这是本工程最难缠的一环，历史失败记录：
#   1. 'roothide' package scheme does not exist
#   2. You do not have any SDKs in .../theos/sdks
#   3. .../toolchain/linux/iphone/bin/clang: No such file or directory
#   4. ld: error: unknown argument '-dynamic' / '-dylib' / '-arch' ...
#      —— clang 是 Apple 目标的，链接器却被换成了 GNU ld，两者不兼容。
#
#   第 4 次的根因有两个，都已修正：
#     (a) 曾写 `command -v ld64.lld || command -v ld.lld || command -v lld`，
#         其中 `lld` 会解析到 /usr/bin/ld（GNU ld）—— 这个降级是致命的；
#     (b) 判定函数只看 clang 是否存在，于是错误的链接器被放行。
#   现在：来源改为 LLVM 官方发布版（明确同时含 clang 与 ld64.lld，
#         且静态链接、不挑发行版），判定同时要求 clang + 真正的 ld64。
# ===========================================================================
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot git make perl xz-utils curl ca-certificates dpkg \
            file zstd unzip zip rsync binutils
          echo ">>> 基础工具:"
          git --version; make --version | head -1; perl --version | head -2

          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "$HOME/.local/bin/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$HOME/.local/bin/ldid"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo ">>> ldid:"; "$HOME/.local/bin/ldid" -h 2>&1 | head -2 || true

      - name: 克隆 Theos
        run: |
          set -e
          rm -rf "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive --recommend-shallow \
            || echo "!!! 子模块补充失败（继续）"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo ">>> Theos 目录:"; ls "$THEOS"
          echo ">>> 可用 package scheme:"; ls "$THEOS/makefiles/package" 2>/dev/null || echo "  (无)"

      # =====================================================================
      # 编译工具链
      #   要求：$THEOS/toolchain/linux/iphone/bin 下有
      #         1) 能交叉编译到 iOS 的 clang
      #         2) Apple 兼容的链接器（ld64 / ld64.lld），绝不能是 GNU ld
      # =====================================================================
      - name: 安装编译工具链
        run: |
          set -uo pipefail

          TBIN="$THEOS/toolchain/linux/iphone/bin"
          LLVM_BASE="https://github.com/llvm/llvm-project/releases/download"
          # 这些版本的 Linux X64 包内同时有 clang 与 ld64.lld，且为静态链接
          LLVM_VERSIONS="llvmorg-18.1.8 llvmorg-17.0.6 llvmorg-16.0.6"

          # ---- 判定：clang 与 ld 都必须存在，且 ld 不能是 GNU ld ----
          ld_is_apple() {
            [ -x "$TBIN/ld" ] || return 1
            # lld 会打印 "LLD <ver>"; ld64 会打印 "ld64"/"PROJECT:ld64"
            if "$TBIN/ld" -v 2>&1 | grep -qiE 'gnu ld|GNU gold'; then
              return 1
            fi
            return 0
          }
          toolchain_ok() {
            [ -x "$TBIN/clang" ] || return 1
            ld_is_apple
          }
          show_state() {
            echo "    clang -> $(readlink -f "$TBIN/clang" 2>/dev/null || echo 无)"
            "$TBIN/clang" --version 2>&1 | head -2 | sed 's/^/      /' || true
            echo "    ld    -> $(readlink -f "$TBIN/ld" 2>/dev/null || echo 无)"
            "$TBIN/ld" -v 2>&1 | head -2 | sed 's/^/      /' || true
          }

          echo "=============================================================="
          echo ">>> 工具链目标: $TBIN"
          echo "=============================================================="

          # ---- 前置清理：清掉任何可能存在的错误链接器 ----
          mkdir -p "$TBIN"
          if [ -x "$TBIN/ld" ]; then
            echo ">>> [前置] 发现已有 ld: $(readlink -f "$TBIN/ld" 2>/dev/null)"
            "$TBIN/ld" -v 2>&1 | head -2 | sed 's/^/      /' || true
          else
            echo ">>> [前置] 尚无 ld"
          fi
          rm -f "$TBIN/ld" "$TBIN/lld" "$TBIN/ld64.lld"
          echo ">>> [前置] 已清除旧的 ld / lld / ld64.lld（将由下面三级重新确定）"

          # ---------------- 方式A：Theos 自带脚本 ----------------
          echo
          echo ">>> 方式A：$THEOS/bin/get-toolchain.sh"
          if [ -x "$THEOS/bin/get-toolchain.sh" ]; then
            "$THEOS/bin/get-toolchain.sh" || echo "!!! get-toolchain.sh 返回非 0"
            echo ">>> 方式A 之后 $TBIN:"; ls "$TBIN" 2>/dev/null | head -30 || true
          else
            echo "!!! 不存在 $THEOS/bin/get-toolchain.sh"
            echo ">>> $THEOS/bin 实际内容:"; ls "$THEOS/bin" 2>/dev/null || true
          fi
          # 脚本可能只建了 clang 目录没给 ld64，这里补一次
          if [ -x "$TBIN/clang" ] && ! ld_is_apple; then
            echo ">>> 方式A 提供了 clang 但没有 Apple 链接器，稍后补齐"
          fi
          if toolchain_ok; then echo ">>> 方式A 完整可用"; show_state; fi

          # ---------------- 方式B：LLVM 官方发布版 ----------------
          if ! toolchain_ok; then
            echo
            echo ">>> 方式B：下载 LLVM 官方发布版（含 clang + ld64.lld）"
            TMPD="$(mktemp -d)"
            llvm_root=""
            for ver in $LLVM_VERSIONS; do
              url="$LLVM_BASE/$ver/LLVM-$ver-Linux-X64.tar.xz"
              echo ">>> 尝试 $url"
              if curl -fsSL --retry 2 --max-time 900 -o "$TMPD/llvm.tar.xz" "$url"; then
                echo "    下载成功，解压中…"
                if tar -xJf "$TMPD/llvm.tar.xz" -C "$TMPD" 2>/dev/null; then
                  llvm_root="$(find "$TMPD" -maxdepth 2 -type d -name 'bin' | head -1)"
                  llvm_root="$(dirname "$llvm_root")"
                  echo "    解压到: $llvm_root"
                  break
                else
                  echo "    解压失败"
                fi
              else
                echo "    下载失败"
              fi
            done

            if [ -n "$llvm_root" ] && [ -x "$llvm_root/bin/clang" ]; then
              echo ">>> LLVM bin 内容抽样:"
              ls "$llvm_root/bin" | grep -iE 'clang|ld|lipo|install_name|^ar$|ranlib' | head -20

              for t in clang clang++ ar ranlib nm strip objcopy objdump \
                       install_name_tool lipo; do
                if [ -x "$llvm_root/bin/$t" ]; then
                  ln -sfn "$llvm_root/bin/$t" "$TBIN/$t"
                else
                  s="$(command -v "$t" 2>/dev/null || true)"
                  [ -n "$s" ] && ln -sfn "$s" "$TBIN/$t"
                fi
              done

              # 链接器：只接受 ld64.lld / ld64.lld.darwinnew 之类，绝不接受裸 ld
              ld_src=""
              for cand in "$llvm_root/bin/ld64.lld" \
                          "$llvm_root/bin/ld64.lld.darwinnew" \
                          "$llvm_root/bin/ld.lld"; do
                [ -x "$cand" ] && { ld_src="$cand"; break; }
              done
              if [ -n "$ld_src" ]; then
                echo ">>> 链接器来源: $ld_src"
                ln -sfn "$ld_src" "$TBIN/ld"
                ln -sfn "$ld_src" "$TBIN/ld64.lld"
              else
                echo "!!! LLVM 包里没找到 ld64.lld"
              fi
              echo ">>> 方式B 生成后的 $TBIN:"; ls -la "$TBIN" | head -30
            else
              echo "!!! 方式B 失败：没拿到可用的 LLVM"
            fi
            rm -rf "$TMPD"
          fi
          if toolchain_ok; then echo ">>> 方式B 完整可用"; show_state; fi

          # ---------------- 方式C：只补链接器（复用方式A 的 clang）----------------
          # 场景：get-toolchain.sh 给了 clang，但它的包里没有 ld64.lld。
          # 这时只需要从 LLVM 包里单独取 ld64.lld 补上。
          if ! toolchain_ok && [ -x "$TBIN/clang" ]; then
            echo
            echo ">>> 方式C：已有 clang，仅补一个 Apple 链接器"
            TMPD="$(mktemp -d)"
            for ver in $LLVM_VERSIONS; do
              url="$LLVM_BASE/$ver/LLVM-$ver-Linux-X64.tar.xz"
              echo ">>> 尝试 $url"
              if curl -fsSL --retry 2 --max-time 900 -o "$TMPD/llvm.tar.xz" "$url"; then
                if tar -xJf "$TMPD/llvm.tar.xz" -C "$TMPD" 2>/dev/null; then
                  found="$(find "$TMPD" -name 'ld64.lld*' -type f 2>/dev/null | head -1)"
                  if [ -n "$found" ]; then
                    echo ">>> 取到: $found"
                    cp -f "$found" "$TBIN/ld64.lld"
                    chmod +x "$TBIN/ld64.lld"
                    ln -sfn "$TBIN/ld64.lld" "$TBIN/ld"
                    break
                  fi
                fi
              fi
              echo "    该版本不可用"
            done
            rm -rf "$TMPD"
            if toolchain_ok; then echo ">>> 方式C 完整可用"; show_state; fi
          fi

          # ---------------- 方式D：Swift 官方工具链（最后手段）----------------
          if ! toolchain_ok; then
            echo
            echo ">>> 方式D：尝试 Swift 官方工具链"
            TMPD="$(mktemp -d)"
            swift_root=""
            for v in 6.0.3-RELEASE 6.0-RELEASE 5.10.1-RELEASE 5.9.2-RELEASE; do
              url="https://download.swift.org/swift-release/ubuntu2204/swift-$v/swift-$v-ubuntu22.04.tar.gz"
              echo ">>> 尝试 $url"
              if curl -fsSL --retry 2 --max-time 900 -o "$TMPD/swift.tar.gz" "$url"; then
                if tar -xzf "$TMPD/swift.tar.gz" -C "$TMPD" 2>/dev/null; then
                  swift_root="$(find "$TMPD" -maxdepth 1 -type d -name 'swift-*' | head -1)"
                  echo "    解压到: $swift_root"
                  break
                fi
              fi
              echo "    不可用"
            done
            if [ -n "$swift_root" ] && [ -x "$swift_root/usr/bin/clang" ]; then
              ln -sfn "$swift_root/usr/bin/clang" "$TBIN/clang"
              for t in clang++ ar ranlib nm strip; do
                [ -x "$swift_root/usr/bin/$t" ] && ln -sfn "$swift_root/usr/bin/$t" "$TBIN/$t"
              done
              ldsrc="$(find "$swift_root" -name 'ld64.lld*' -type f 2>/dev/null | head -1)"
              if [ -n "$ldsrc" ]; then
                ln -sfn "$ldsrc" "$TBIN/ld"; ln -sfn "$ldsrc" "$TBIN/ld64.lld"
              else
                echo "    !!! Swift 包里没有 ld64.lld（这正是之前链接失败的原因）"
              fi
            fi
            rm -rf "$TMPD"
          fi

          # ---------------- 硬校验：工具链 ----------------
          echo
          echo "=============================================================="
          echo ">>> 工具链校验"
          echo "=============================================================="
          echo "--- $TBIN ---"; ls -la "$TBIN" 2>/dev/null | head -30 || echo "  (不存在)"
          show_state || true
          if toolchain_ok; then
            echo "工具链校验通过"
          else
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "!!! 工具链不满足要求：需要 clang + Apple 兼容链接器(ld64/ld64.lld)。"
            echo "!!! 若上面显示 ld 指向 GNU ld，说明降级路径又被触发了。"
            echo "!!! 请把完整输出发给我。"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi

      # =====================================================================
      # iOS SDK
      # =====================================================================
      - name: 安装 iOS SDK
        run: |
          set -uo pipefail

          sdk_ok() {
            [ -d "$THEOS/sdks" ] && \
            [ -n "$(ls -A "$THEOS/sdks" 2>/dev/null)" ] && \
            ls "$THEOS/sdks" | grep -qi '^iPhoneOS.*\.sdk$'
          }

          echo ">>> 方式A：git clone theos/sdks"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks" \
            || echo "!!! 克隆失败"
          ls "$THEOS/sdks" 2>/dev/null | head -20 || true
          sdk_ok && echo ">>> 方式A 成功" || echo ">>> 方式A 未成功"

          if ! sdk_ok; then
            echo ">>> 方式B：下载 theos/sdks 归档"
            mkdir -p "$THEOS/sdks"
            TMPD="$(mktemp -d)"
            got=0
            for u in \
              "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz" \
              "https://github.com/theos/sdks/archive/refs/heads/main.tar.gz" \
              "https://codeload.github.com/theos/sdks/tar.gz/refs/heads/master"
            do
              echo ">>> 尝试 $u"
              if curl -fsSL --retry 3 --max-time 900 -o "$TMPD/sdks.tar.gz" "$u"; then
                if tar -xzf "$TMPD/sdks.tar.gz" -C "$TMPD"; then
                  find "$TMPD" -maxdepth 3 -name '*.sdk' -type d \
                    -exec cp -R {} "$THEOS/sdks/" \; && got=1
                  break
                fi
              fi
            done
            rm -rf "$TMPD"
            [ "$got" = "1" ] && echo ">>> 方式B 成功" || echo "!!! 方式B 失败"
          fi

          if ! sdk_ok && [ -x "$THEOS/bin/get-sdks.sh" ]; then
            echo ">>> 方式C：$THEOS/bin/get-sdks.sh"
            "$THEOS/bin/get-sdks.sh" || echo "!!! get-sdks.sh 返回非 0"
          fi

          echo "--- \$THEOS/sdks ---"; ls -la "$THEOS/sdks" 2>/dev/null || echo "  (不存在)"
          if sdk_ok; then
            echo "SDK 校验通过"
          else
            echo "!!! 仍然没有可用 SDK，构建必然失败。"
            exit 1
          fi

      # =====================================================================
      # 真实链接自检：用最小 dylib 验证 clang + ld64 + SDK 能协同工作。
      # 这一步是本次新增的关键保险 —— 让「链接器不对」在构建业务代码之前
      # 就暴露，而不是等到打包阶段才以一堆 unknown argument 的形式出现。
      # =====================================================================
      - name: 链接自检（最小 dylib）
        run: |
          set -uo pipefail
          TBIN="$THEOS/toolchain/linux/iphone/bin"
          SDK="$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -1)"
          echo ">>> 使用 SDK: $SDK"

          TMPD="$(mktemp -d)"
          cat > "$TMPD/t.m" <<'EOF'
          #import <Foundation/Foundation.h>
          static int zz_selftest(void) { return 7; }
          EOF

          fail=0
          for arch in arm64 arm64e; do
            echo ">>> 尝试链接 $arch"
            if "$TBIN/clang" -x objective-c -c "$TMPD/t.m" -o "$TMPD/t-$arch.o" \
                 -target "$arch-apple-ios15.0" -isysroot "$SDK" -fobjc-arc 2>&1 | tail -5; then
              if "$TBIN/clang" -dynamiclib -arch "$arch" -isysroot "$SDK" \
                   -miphoneos-version-min=15.0 -framework Foundation \
                   "$TMPD/t-$arch.o" -o "$TMPD/t-$arch.dylib" 2>&1 | tail -10; then
                if [ -f "$TMPD/t-$arch.dylib" ]; then
                  echo "    $arch 链接成功 ($(stat -c%s "$TMPD/t-$arch.dylib") 字节)"
                else
                  echo "    !!! $arch 未生成产物"; fail=1
                fi
              else
                echo "    !!! $arch 链接失败"; fail=1
              fi
            else
              echo "    !!! $arch 编译失败"; fail=1
            fi
          done
          rm -rf "$TMPD"

          if [ "$fail" = "0" ]; then
            echo ">>> 链接自检通过：clang + 链接器 + SDK 协同正常"
          else
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "!!! 链接自检失败 —— 工具链或 SDK 有问题，业务代码必然也构建不了。"
            echo "!!! 请把上面输出发给我。"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi

      - name: 从原始 deb 中取出两个 dylib 与 plist
        run: |
          set -e
          mkdir -p vendor
          TMP="$(mktemp -d)"
          for f in vendor_src/*.deb; do
            echo ">>> 解包 $f"
            dpkg-deb -x "$f" "$TMP"
            find "$TMP" -name '*.dylib' -exec cp -v {} vendor/ \;
            find "$TMP" -name '*.plist' -path '*DynamicLibraries*' -exec cp -v {} vendor/ \;
          done
          echo ">>> vendor:"; ls -la vendor/
          test -f "vendor/转转找鸡.dylib" || (echo "缺少 转转找鸡.dylib"; exit 1)
          test -f "vendor/ShuiShuiZZFilter.dylib" || (echo "缺少 ShuiShuiZZFilter.dylib"; exit 1)

      - name: 给原始 dylib 重新签名
        run: |
          set -e
          for d in vendor/*.dylib; do echo ">>> ldid -S $d"; ldid -S "$d"; done

      - name: 构建 deb
        run: |
          set -e
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1
          echo ">>> 产物:"; find . -maxdepth 2 -name '*.deb' -exec ls -la {} \;

      - name: 检查 deb 内容
        run: |
          set -e
          DEB=$(find . -maxdepth 2 -name '*.deb' | head -1)
          echo ">>> deb = $DEB"
          echo "----- control -----"; dpkg-deb -I "$DEB"
          echo "----- 文件清单 -----"; dpkg-deb -c "$DEB"
          echo "----- dylib 校验 -----"
          rm -rf /tmp/chk && mkdir -p /tmp/chk
          dpkg-deb -x "$DEB" /tmp/chk
          for d in /tmp/chk/Library/MobileSubstrate/DynamicLibraries/*.dylib; do
            echo "--- $(basename "$d")"
            file "$d" | sed 's/^/    /'
            ldid -e "$d" >/dev/null 2>&1 && echo "    签名: OK" || echo "    签名: 缺失"
          done
          echo "----- 最终清单（应为 3 个 dylib）-----"
          ls /tmp/chk/Library/MobileSubstrate/DynamicLibraries/

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: zzmerge-deb
          path: "*.deb"
          if-no-files-found: error
