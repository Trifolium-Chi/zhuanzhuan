name: Build ZZMerge deb

# ===========================================================================
# 触发：推送到 main/master，或手动 Run workflow
#
# 【构建模式】rootful（默认），刻意不设 THEOS_PACKAGE_SCHEME。
#   依据：原版找鸡的 control 写着 Pre-Depends: rootless-compat，
#   安装路径 /Library/MobileSubstrate/DynamicLibraries/ —— 它本身就是 rootful，
#   由 rootless-compat 在无根/RootHide 设备上做路径映射。照抄它最稳。
#   另：Theos 不存在名为 "roothide" 的 scheme。
#
# 【工具链】历史失败记录：
#   1. 'roothide' package scheme does not exist
#   2. You do not have any SDKs in .../theos/sdks
#   3. .../toolchain/linux/iphone/bin/clang: No such file or directory
#   4. ld: error: unknown argument '-dynamic' / '-dylib' / '-arch'
#      —— clang 是 Apple 目标，链接器却是 GNU ld
#   5.
#      (a) 我调用了 theos/bin/get-toolchain.sh —— 这个文件**根本不存在**。
#          真实脚本是 install-theos / install-sdk / swift-bootstrapper.pl。
#      (b) 我拼的下载 URL 是错的（把 git tag 前缀 llvmorg- 拼进了文件名）。
#
#   现在策略：优先用 Theos 自己的安装脚本（它们的 URL 由 Theos 维护，最可靠），
#             并保留多候选 URL 探测，**每个候选都打印 HTTP 状态码**，
#             这样失败时能一眼看出是 URL 错还是网络问题。
# ===========================================================================
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot git make perl xz-utils curl ca-certificates dpkg \
            file zstd unzip zip rsync binutils
          echo ">>> 基础工具:"
          git --version; make --version | head -1; perl --version | head -2

          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "$HOME/.local/bin/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$HOME/.local/bin/ldid"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo ">>> ldid:"; "$HOME/.local/bin/ldid" -h 2>&1 | head -2 || true

      - name: 克隆 Theos（并打印其安装脚本，便于核实）
        run: |
          set -e
          rm -rf "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive --recommend-shallow \
            || echo "!!! 子模块补充失败（继续）"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo ">>> Theos 目录:"; ls "$THEOS"
          echo ">>> 可用 package scheme:"; ls "$THEOS/makefiles/package" 2>/dev/null || echo "  (无)"
          echo ">>> bin 内容:"; ls "$THEOS/bin"
          echo
          echo "=============================================================="
          echo ">>> swift-bootstrapper.pl —— 看它用什么 URL 下载工具链"
          echo "=============================================================="
          # 这是核实"正确下载地址"的最可靠办法：直接看 Theos 自己怎么写的
          grep -nE 'https?://|download|\.tar|ubuntu|RELEASE' \
            "$THEOS/bin/swift-bootstrapper.pl" 2>/dev/null | head -40 \
            || echo "(读取失败)"
          echo
          echo ">>> update-theos 里的下载相关行:"
          grep -nE 'https?://' "$THEOS/bin/update-theos" 2>/dev/null | head -20 || true
          echo
          echo ">>> install-theos 前 60 行:"
          head -60 "$THEOS/bin/install-theos" 2>/dev/null || true

      # =====================================================================
      # 编译工具链
      #   目标：$THEOS/toolchain/linux/iphone/bin 下有
      #         1) 能交叉编译到 iOS 的 clang
      #         2) Apple 兼容链接器（ld64/ld64.lld），绝不能是 GNU ld
      # =====================================================================
      - name: 安装编译工具链
        run: |
          set -uo pipefail

          TBIN="$THEOS/toolchain/linux/iphone/bin"

          ld_is_apple() {
            [ -x "$TBIN/ld" ] || return 1
            if "$TBIN/ld" -v 2>&1 | grep -qiE 'gnu ld|GNU gold'; then
              return 1
            fi
            return 0
          }
          toolchain_ok() {
            [ -x "$TBIN/clang" ] || return 1
            ld_is_apple
          }
          show_state() {
            echo "    clang -> $(readlink -f "$TBIN/clang" 2>/dev/null || echo 无)"
            "$TBIN/clang" --version 2>&1 | head -2 | sed 's/^/      /' || true
            echo "    ld    -> $(readlink -f "$TBIN/ld" 2>/dev/null || echo 无)"
            "$TBIN/ld" -v 2>&1 | head -2 | sed 's/^/      /' || true
          }
          # 探测 URL 是否可下载；打印状态码，便于判断是 URL 错还是网络问题
          try_get() {
            url="$1"; out="$2"
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "    [HTTP $code] 可下载: $url"
              curl -fsSL --retry 2 --max-time 1800 -o "$out" "$url" && return 0
              echo "    !!! 下载中断"
              return 1
            fi
            echo "    [HTTP $code] 不可用: $url"
            return 1
          }

          mkdir -p "$TBIN"
          echo ">>> [前置] 清理旧的链接器"
          rm -f "$TBIN/ld" "$TBIN/lld" "$TBIN/ld64.lld"

          # ---------------- 方式A：Theos 官方 install-theos ----------------
          echo
          echo ">>> 方式A：$THEOS/bin/install-theos（Theos 官方安装脚本）"
          if [ -x "$THEOS/bin/install-theos" ]; then
            # 该脚本可能有交互提示，用 timeout 防止卡死；用文件喂 stdin 以保留退出码
            printf '\n\n\n\n\n' > /tmp/ans.txt
            timeout 1500 bash "$THEOS/bin/install-theos" < /tmp/ans.txt 2>&1 | tail -80
            echo ">>> install-theos 退出码: ${PIPESTATUS[0]}"
          else
            echo "!!! 不存在 $THEOS/bin/install-theos"
          fi
          echo ">>> 方式A 之后 $TBIN:"
          ls -la "$TBIN" 2>/dev/null | head -30 || echo "  (不存在)"
          if toolchain_ok; then echo ">>> 方式A 完整可用"; show_state; fi

          # ---------------- 方式B：Theos 的 SDK 安装器（有时会连带装工具链）----
          if ! toolchain_ok; then
            echo
            echo ">>> 方式B：$THEOS/bin/install-sdk"
            if [ -x "$THEOS/bin/install-sdk" ]; then
              printf '\n\n\n\n\n' > /tmp/ans.txt
              timeout 1500 bash "$THEOS/bin/install-sdk" < /tmp/ans.txt 2>&1 | tail -60
              echo ">>> install-sdk 退出码: ${PIPESTATUS[0]}"
            else
              echo "!!! 不存在 $THEOS/bin/install-sdk"
            fi
            if toolchain_ok; then echo ">>> 方式B 完整可用"; show_state; fi
          fi

          # ---------------- 方式C：Swift 工具链（多候选 URL + 状态码）----
          # Ubuntu 22.04 命名为 ubuntu22.04；24.04 为 ubuntu24.04。
          # 具体版本号逐个探测，避免再靠猜。
          if ! toolchain_ok; then
            echo
            echo ">>> 方式C：Swift 官方工具链（多候选探测）"
            TMPD="$(mktemp -d)"
            swift_root=""
            for tag in ubuntu24.04 ubuntu22.04 ubuntu20.04; do
              for v in 6.1-RELEASE 6.0.3-RELEASE 6.0.2-RELEASE 6.0-RELEASE \
                       5.10.1-RELEASE 5.10-RELEASE 5.9.2-RELEASE 5.8.1-RELEASE; do
                [ -n "$swift_root" ] && break
                # 两种可能的路径形式都试
                for url in \
                  "https://download.swift.org/swift-release/${tag//./}/swift-$v/swift-$v-$tag.tar.gz" \
                  "https://download.swift.org/swift-$v-release/${tag//./}/swift-$v-$tag.tar.gz"
                do
                  [ -n "$swift_root" ] && break
                  if try_get "$url" "$TMPD/swift.tar.gz"; then
                    if tar -xzf "$TMPD/swift.tar.gz" -C "$TMPD" 2>/dev/null; then
                      swift_root="$(find "$TMPD" -maxdepth 1 -type d -name 'swift-*' | head -1)"
                      echo "    解压到: $swift_root"
                    fi
                  fi
                done
              done
              [ -n "$swift_root" ] && break
            done

            if [ -n "$swift_root" ] && [ -x "$swift_root/usr/bin/clang" ]; then
              echo ">>> Swift bin 抽样:"
              ls "$swift_root/usr/bin" | grep -iE 'clang|ld|lipo|install_name' | head -20
              for t in clang clang++ ar ranlib nm strip; do
                [ -x "$swift_root/usr/bin/$t" ] && ln -sfn "$swift_root/usr/bin/$t" "$TBIN/$t"
              done
              ldsrc="$(find "$swift_root" -name 'ld64.lld*' -type f 2>/dev/null | head -1)"
              if [ -n "$ldsrc" ]; then
                echo "    找到 Apple 链接器: $ldsrc"
                ln -sfn "$ldsrc" "$TBIN/ld"; ln -sfn "$ldsrc" "$TBIN/ld64.lld"
              else
                echo "    !!! Swift 包里没有 ld64.lld（需要靠方式D 补）"
              fi
            else
              echo "!!! 方式C 未拿到 Swift 工具链"
            fi
            rm -rf "$TMPD"
            if toolchain_ok; then echo ">>> 方式C 完整可用"; show_state; fi
          fi

          # ---------------- 方式D：LLVM 官方包（补 clang 和/或 ld64.lld）----
          # 官方发布包文件名形如 clang+llvm-<ver>-x86_64-linux-gnu-ubuntu-<os>.tar.xz
          # 注意：文件名里**不含** git tag 的 "llvmorg-" 前缀（这是我上轮的错误）。
          # 这里穷举几种已知命名形式，并打印每个候选的 HTTP 状态码。
          if ! toolchain_ok; then
            echo
            echo ">>> 方式D：LLVM 官方发布包（多候选探测）"
            TMPD="$(mktemp -d)"
            llvm_root=""
            for ver in 18.1.8 17.0.6 16.0.6 15.0.7; do
              [ -n "$llvm_root" ] && break
              for os in ubuntu-18.04 ubuntu-20.04 ubuntu-22.04 ubuntu-16.04; do
                [ -n "$llvm_root" ] && break
                url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/clang+llvm-$ver-x86_64-linux-gnu-$os.tar.xz"
                if try_get "$url" "$TMPD/llvm.tar.xz"; then
                  if tar -xJf "$TMPD/llvm.tar.xz" -C "$TMPD" 2>/dev/null; then
                    llvm_root="$(find "$TMPD" -maxdepth 2 -type d -name bin | head -1)"
                    llvm_root="$(dirname "$llvm_root")"
                    echo "    解压到: $llvm_root"
                  fi
                fi
              done
            done

            if [ -n "$llvm_root" ] && [ -x "$llvm_root/bin/clang" ]; then
              echo ">>> LLVM bin 抽样:"
              ls "$llvm_root/bin" | grep -iE 'clang|ld|lipo|install_name|^ar$|ranlib' | head -20
              # clang 只在还没有的时候才补
              if [ ! -x "$TBIN/clang" ]; then
                for t in clang clang++ ar ranlib nm strip objcopy objdump \
                         install_name_tool lipo; do
                  if [ -x "$llvm_root/bin/$t" ]; then
                    ln -sfn "$llvm_root/bin/$t" "$TBIN/$t"
                  else
                    s="$(command -v "$t" 2>/dev/null || true)"
                    [ -n "$s" ] && ln -sfn "$s" "$TBIN/$t"
                  fi
                done
              fi
              # 链接器：只接受 ld64 系列
              if ! ld_is_apple; then
                ldsrc=""
                for cand in "$llvm_root/bin/ld64.lld" \
                            "$llvm_root/bin/ld64.lld.darwinnew" \
                            "$llvm_root/bin/ld.lld"; do
                  [ -x "$cand" ] && { ldsrc="$cand"; break; }
                done
                if [ -n "$ldsrc" ]; then
                  echo ">>> 链接器来源: $ldsrc"
                  ln -sfn "$ldsrc" "$TBIN/ld"; ln -sfn "$ldsrc" "$TBIN/ld64.lld"
                else
                  echo "!!! LLVM 包里没找到 ld64.lld"
                fi
              fi
              ls -la "$TBIN" | head -30
            else
              echo "!!! 方式D 未拿到 LLVM 包"
            fi
            rm -rf "$TMPD"
            if toolchain_ok; then echo ">>> 方式D 完整可用"; show_state; fi
          fi

          # ---------------- 硬校验 ----------------
          echo
          echo "=============================================================="
          echo ">>> 工具链校验"
          echo "=============================================================="
          echo "--- $TBIN ---"; ls -la "$TBIN" 2>/dev/null | head -30 || echo "  (不存在)"
          show_state || true
          if toolchain_ok; then
            echo "工具链校验通过"
          else
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "!!! 工具链不满足：需要 clang + Apple 兼容链接器(ld64/ld64.lld)。"
            echo "!!! 请把上面【方式A~D 的完整输出】发给我 —— 里面有每个候选 URL"
            echo "!!! 的 HTTP 状态码，可以直接看出是地址错还是网络受限。"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi

      # =====================================================================
      # iOS SDK
      # =====================================================================
      - name: 安装 iOS SDK
        run: |
          set -uo pipefail

          sdk_ok() {
            [ -d "$THEOS/sdks" ] && \
            [ -n "$(ls -A "$THEOS/sdks" 2>/dev/null)" ] && \
            ls "$THEOS/sdks" | grep -qi '^iPhoneOS.*\.sdk$'
          }

          sdk_ok && echo ">>> SDK 已由前面步骤装好" || true

          if ! sdk_ok; then
            echo ">>> 方式A：git clone theos/sdks"
            rm -rf "$THEOS/sdks"
            git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks" \
              || echo "!!! 克隆失败"
            ls "$THEOS/sdks" 2>/dev/null | head -20 || true
          fi

          if ! sdk_ok; then
            echo ">>> 方式B：$THEOS/bin/install-sdk"
            if [ -x "$THEOS/bin/install-sdk" ]; then
              printf '\n\n\n\n\n' > /tmp/ans.txt
              timeout 1500 bash "$THEOS/bin/install-sdk" < /tmp/ans.txt 2>&1 | tail -60
            fi
          fi

          if ! sdk_ok; then
            echo ">>> 方式C：下载 theos/sdks 归档"
            mkdir -p "$THEOS/sdks"
            TMPD="$(mktemp -d)"
            for u in \
              "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz" \
              "https://github.com/theos/sdks/archive/refs/heads/main.tar.gz"
            do
              code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 60 "$u" || echo 000)
              echo "    [HTTP $code] $u"
              if [ "$code" = "200" ] || [ "$code" = "302" ]; then
                curl -fsSL --retry 3 --max-time 1800 -o "$TMPD/sdks.tar.gz" "$u" || continue
                if tar -xzf "$TMPD/sdks.tar.gz" -C "$TMPD"; then
                  find "$TMPD" -maxdepth 3 -name '*.sdk' -type d \
                    -exec cp -R {} "$THEOS/sdks/" \; && break
                fi
              fi
            done
            rm -rf "$TMPD"
          fi

          echo "--- \$THEOS/sdks ---"; ls -la "$THEOS/sdks" 2>/dev/null || echo "  (不存在)"
          if sdk_ok; then
            echo "SDK 校验通过"
          else
            echo "!!! 仍然没有可用 SDK，构建必然失败。"
            exit 1
          fi

      # =====================================================================
      # 真实链接自检：用最小 dylib 验证 clang + 链接器 + SDK 能协同工作。
      # 新增于第 4 次失败之后 —— 让「链接器不对」在构建业务代码之前就暴露。
      # =====================================================================
      - name: 链接自检（最小 dylib）
        run: |
          set -uo pipefail
          TBIN="$THEOS/toolchain/linux/iphone/bin"
          SDK="$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -1)"
          echo ">>> SDK: $SDK"
          echo ">>> ld  -> $(readlink -f "$TBIN/ld" 2>/dev/null || echo 无)"

          TMPD="$(mktemp -d)"
          cat > "$TMPD/t.m" <<'EOF'
          #import <Foundation/Foundation.h>
          static int zz_selftest(void) { return 7; }
          EOF

          fail=0
          for arch in arm64 arm64e; do
            echo ">>> 链接 $arch"
            if "$TBIN/clang" -x objective-c -c "$TMPD/t.m" -o "$TMPD/t-$arch.o" \
                 -target "$arch-apple-ios15.0" -isysroot "$SDK" -fobjc-arc 2>&1 | tail -5; then
              if "$TBIN/clang" -dynamiclib -arch "$arch" -isysroot "$SDK" \
                   -miphoneos-version-min=15.0 -framework Foundation \
                   "$TMPD/t-$arch.o" -o "$TMPD/t-$arch.dylib" 2>&1 | tail -10; then
                [ -f "$TMPD/t-$arch.dylib" ] \
                  && echo "    $arch 链接成功 ($(stat -c%s "$TMPD/t-$arch.dylib") 字节)" \
                  || { echo "    !!! $arch 未生成产物"; fail=1; }
              else
                echo "    !!! $arch 链接失败"; fail=1
              fi
            else
              echo "    !!! $arch 编译失败"; fail=1
            fi
          done
          rm -rf "$TMPD"

          if [ "$fail" = "0" ]; then
            echo ">>> 链接自检通过"
          else
            echo "!!! 链接自检失败 —— 工具链或 SDK 有问题。"
            exit 1
          fi

      - name: 从原始 deb 中取出两个 dylib 与 plist
        run: |
          set -e
          mkdir -p vendor
          TMP="$(mktemp -d)"
          for f in vendor_src/*.deb; do
            echo ">>> 解包 $f"
            dpkg-deb -x "$f" "$TMP"
            find "$TMP" -name '*.dylib' -exec cp -v {} vendor/ \;
            find "$TMP" -name '*.plist' -path '*DynamicLibraries*' -exec cp -v {} vendor/ \;
          done
          echo ">>> vendor:"; ls -la vendor/
          test -f "vendor/转转找鸡.dylib" || (echo "缺少 转转找鸡.dylib"; exit 1)
          test -f "vendor/ShuiShuiZZFilter.dylib" || (echo "缺少 ShuiShuiZZFilter.dylib"; exit 1)

      - name: 给原始 dylib 重新签名
        run: |
          set -e
          for d in vendor/*.dylib; do echo ">>> ldid -S $d"; ldid -S "$d"; done

      - name: 构建 deb
        run: |
          set -e
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1
          echo ">>> 产物:"; find . -maxdepth 2 -name '*.deb' -exec ls -la {} \;

      - name: 检查 deb 内容
        run: |
          set -e
          DEB=$(find . -maxdepth 2 -name '*.deb' | head -1)
          echo ">>> deb = $DEB"
          echo "----- control -----"; dpkg-deb -I "$DEB"
          echo "----- 文件清单 -----"; dpkg-deb -c "$DEB"
          echo "----- dylib 校验 -----"
          rm -rf /tmp/chk && mkdir -p /tmp/chk
          dpkg-deb -x "$DEB" /tmp/chk
          for d in /tmp/chk/Library/MobileSubstrate/DynamicLibraries/*.dylib; do
            echo "--- $(basename "$d")"; file "$d" | sed 's/^/    /'
            ldid -e "$d" >/dev/null 2>&1 && echo "    签名: OK" || echo "    签名: 缺失"
          done
          echo "----- 最终清单（应为 3 个 dylib）-----"
          ls /tmp/chk/Library/MobileSubstrate/DynamicLibraries/

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: zzmerge-deb
          path: "*.deb"
          if-no-files-found: error
