name: Build ZZMerge deb

# 触发方式：
#   1. 推送到 main / master 自动构建
#   2. 手动：Actions -> Run workflow
#
# 【重要】关于构建模式：
#   本包刻意采用 **rootful（默认）** 构建方式，不设置 THEOS_PACKAGE_SCHEME。
#
#   原因：原版「转转找鸡」包就是 rootful 构建，证据是它的元数据：
#       Pre-Depends: rootless-compat (>= 0.9)
#       安装路径:    /Library/MobileSubstrate/DynamicLibraries/
#   rootless-compat 这层兼容包会在无根 / RootHide 设备上把 /Library/...
#   自动映射到真实位置（如 /var/jb/Library/...）。所以照抄它的构建方式最稳——
#   你的设备上找鸡本来就能用，说明这条路是通的。
#
#   另外：Theos 官方并不存在名为 "roothide" 的 package scheme，
#   设置它会直接报错 "'roothide' package scheme does not exist"。
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      # 故意不设置 THEOS_PACKAGE_SCHEME —— 保持 rootful，与找鸡一致

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 安装构建依赖（含编译工具链依赖）
        run: |
          set -e
          sudo apt-get update
          # clang/lld/gold 等是"系统 clang 兜底"路径要用的；
          # libtinfo5 部分脚本会依赖，装不上不算致命。
          sudo apt-get install -y --no-install-recommends \
            fakeroot git make perl xz-utils curl ca-certificates dpkg \
            file zstd unzip zip rsync \
            clang lld llvm binutils
          sudo apt-get install -y --no-install-recommends libtinfo5 \
            || echo "!!! libtinfo5 装不上（继续）"

          echo ">>> 系统编译器版本:"
          clang --version | head -3
          which ld64.lld ld.lld lld 2>/dev/null || echo "  (未找到 lld 变体)"

          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$HOME/.local/bin/ldid"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ldid" -h 2>&1 | head -2 || true

      - name: 克隆 Theos
        run: |
          set -e
          rm -rf "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive --recommend-shallow \
            || echo "!!! 子模块补充失败（继续）"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo ">>> Theos 目录:"
          ls "$THEOS"
          echo ">>> 当前 Theos 支持的 package scheme（用于核对）:"
          ls "$THEOS/makefiles/package" 2>/dev/null || echo "  (无 package 目录)"

      # =========================================================================
      # 工具链：这是本次失败的直接原因（toolchain/linux/iphone/bin/clang 不存在）
      # 三级策略 + 硬校验，任何一级成功即止；全失败则打印诊断并退出
      # =========================================================================
      - name: 安装编译工具链（三级回退，失败即报错）
        run: |
          set -uo pipefail

          TOOLCHAIN_DIR="$THEOS/toolchain/linux/iphone"

          toolchain_ok() {
            [ -x "$TOOLCHAIN_DIR/bin/clang" ]
          }

          echo "=============================================================="
          echo ">>> 工具链目标目录: $TOOLCHAIN_DIR"
          echo "=============================================================="

          # ---------------- 方式A：scripts/get-toolchain.sh ----------------
          echo
          echo ">>> 方式A：$THEOS/bin/get-toolchain.sh"
          if [ -x "$THEOS/bin/get-toolchain.sh" ]; then
            "$THEOS/bin/get-toolchain.sh" || echo "!!! get-toolchain.sh 返回非 0"
          else
            echo "!!! 找不到 $THEOS/bin/get-toolchain.sh"
          fi
          toolchain_ok && echo ">>> 方式A 成功" || echo ">>> 方式A 未成功"

          # ---------------- 方式B：直接下载 Swift 工具链 ----------------
          if ! toolchain_ok; then
            echo
            echo ">>> 方式B：下载 Swift 官方工具链（含可用于交叉编译的 clang）"

            SWIFT_BASE="https://download.swift.org/swift-release/ubuntu2204"
            UBUNTU_TAG="ubuntu22.04"
            CANDIDATES="6.0.3-RELEASE 6.0.2-RELEASE 6.0.1-RELEASE 6.0-RELEASE 5.10.1-RELEASE 5.10-RELEASE 5.9.2-RELEASE"

            TMPD="$(mktemp -d)"
            swift_root=""
            for v in $CANDIDATES; do
              url="$SWIFT_BASE/swift-$v/swift-$v-$UBUNTU_TAG.tar.gz"
              echo ">>> 尝试 $url"
              if curl -fsSL --retry 2 --max-time 600 -o "$TMPD/swift.tar.gz" "$url"; then
                echo "    下载成功，解压中…"
                if tar -xzf "$TMPD/swift.tar.gz" -C "$TMPD"; then
                  swift_root="$(find "$TMPD" -maxdepth 1 -type d -name 'swift-*' | head -1)"
                  echo "    解压到: $swift_root"
                  break
                else
                  echo "    解压失败"
                fi
              else
                echo "    下载失败（可能该版本不存在）"
              fi
            done

            if [ -n "$swift_root" ] && [ -x "$swift_root/usr/bin/clang" ]; then
              echo ">>> 把 Swift 工具链链接到 $TOOLCHAIN_DIR"
              mkdir -p "$(dirname "$TOOLCHAIN_DIR")"
              rm -rf "$TOOLCHAIN_DIR"
              ln -sfn "$swift_root/usr" "$TOOLCHAIN_DIR"
              echo ">>> 链接结果: $(readlink -f "$TOOLCHAIN_DIR" 2>/dev/null || echo '?')"
            else
              echo "!!! 方式B 失败：没找到可用的 Swift 工具链"
            fi
            rm -rf "$TMPD"
          fi
          toolchain_ok && echo ">>> 方式B 后工具链可用" || echo ">>> 方式B 后工具链仍不可用"

          # ---------------- 方式C：系统 clang 兜底 ----------------
          # clang 本身就能产出 Mach-O 目标，配上 theos 传的 -isysroot 即可交叉编译。
          # 这样即使 Swift 工具链下载不到（网络受限），依然有机会构建成功。
          if ! toolchain_ok; then
            echo
            echo ">>> 方式C：用系统 clang 构造 Theos 期望的工具链目录"
            SYSCLANG="$(command -v clang || true)"
            SYSLD="$(command -v ld64.lld || command -v ld.lld || command -v lld || true)"
            echo "    clang = ${SYSCLANG:-未找到}"
            echo "    ld    = ${SYSLD:-未找到}"

            if [ -n "$SYSCLANG" ]; then
              mkdir -p "$TOOLCHAIN_DIR/bin"
              for tool in clang clang++ cc c++ ld lld ar ranlib nm strip objcopy \
                          objdump lipo install_name_tool; do
                # 只为系统真实存在的工具建立链接
                case "$tool" in
                  clang|clang++) src="$SYSCLANG" ;;
                  cc)            src="$(command -v clang)" ;;
                  c++)           src="$(command -v clang++)" ;;
                  ld|lld)        src="$SYSLD" ;;
                  *)             src="$(command -v "$tool" 2>/dev/null || true)" ;;
                esac
                [ -n "$src" ] && [ -x "$src" ] && ln -sfn "$src" "$TOOLCHAIN_DIR/bin/$tool"
              done
              # ld64.lld 若存在，优先给 ld 用（Apple 目标更合适）
              if command -v ld64.lld >/dev/null 2>&1; then
                ln -sfn "$(command -v ld64.lld)" "$TOOLCHAIN_DIR/bin/ld"
                ln -sfn "$(command -v ld64.lld)" "$TOOLCHAIN_DIR/bin/ld64.lld"
              fi
              echo ">>> 方式C 生成内容:"
              ls -la "$TOOLCHAIN_DIR/bin/" | head -30
            fi
          fi
          toolchain_ok && echo ">>> 方式C 后工具链可用" || echo ">>> 方式C 后工具链仍不可用"

          # ---------------- 硬校验 ----------------
          echo
          echo "=============================================================="
          echo ">>> 工具链校验"
          echo "=============================================================="
          ls -la "$THEOS/toolchain" 2>/dev/null || echo "  (toolchain 目录不存在)"
          if toolchain_ok; then
            echo ">>> clang 可用性测试:"
            "$TOOLCHAIN_DIR/bin/clang" --version 2>&1 | head -3 || true
            echo "工具链校验通过"
          else
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "!!! 仍然没有可用工具链，构建必然失败。"
            echo "!!! 请把上面完整输出发给我。"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi

      - name: 安装 iOS SDK（三级回退，失败即报错）
        run: |
          set -uo pipefail

          sdk_ok() {
            [ -d "$THEOS/sdks" ] && \
            [ -n "$(ls -A "$THEOS/sdks" 2>/dev/null)" ] && \
            ls "$THEOS/sdks" | grep -qi '^iPhoneOS.*\.sdk$'
          }

          # ---------------- 方式A：直接克隆 theos/sdks ----------------
          echo "=============================================================="
          echo ">>> 方式A：git clone theos/sdks"
          echo "=============================================================="
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks" \
            || echo "!!! 克隆 theos/sdks 失败"
          ls "$THEOS/sdks" 2>/dev/null | head -20 || true
          sdk_ok && echo ">>> 方式A 成功" || echo ">>> 方式A 未成功"

          # ---------------- 方式B：下载归档包 ----------------
          if ! sdk_ok; then
            echo
            echo "=============================================================="
            echo ">>> 方式B：下载 theos/sdks 的 tar.gz 归档"
            echo "=============================================================="
            mkdir -p "$THEOS/sdks"
            TMPD="$(mktemp -d)"
            got=0
            for u in \
              "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz" \
              "https://github.com/theos/sdks/archive/refs/heads/main.tar.gz" \
              "https://codeload.github.com/theos/sdks/tar.gz/refs/heads/master"
            do
              echo ">>> 尝试 $u"
              if curl -fsSL --retry 3 --max-time 600 -o "$TMPD/sdks.tar.gz" "$u"; then
                if tar -xzf "$TMPD/sdks.tar.gz" -C "$TMPD"; then
                  find "$TMPD" -maxdepth 3 -name '*.sdk' -type d \
                    -exec cp -R {} "$THEOS/sdks/" \; && got=1
                  break
                fi
              fi
            done
            rm -rf "$TMPD"
            [ "$got" = "1" ] && echo ">>> 方式B 成功" || echo "!!! 方式B 失败"
          fi

          # ---------------- 方式C：调用 Theos 自带脚本 ----------------
          if ! sdk_ok && [ -x "$THEOS/bin/get-sdks.sh" ]; then
            echo
            echo ">>> 方式C：$THEOS/bin/get-sdks.sh"
            "$THEOS/bin/get-sdks.sh" || echo "!!! get-sdks.sh 返回非 0"
          fi

          # ---------------- 硬校验 ----------------
          echo
          echo "=============================================================="
          echo ">>> SDK 校验"
          echo "=============================================================="
          echo "--- \$THEOS/sdks 内容 ---"
          ls -la "$THEOS/sdks" 2>/dev/null || echo "  (不存在)"
          if sdk_ok; then
            echo "SDK 校验通过"
          else
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "!!! 仍然没有可用 SDK，构建必然失败。"
            echo "!!! 请把上面完整输出发给我。"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: 从原始 deb 中取出两个 dylib 与 plist
        run: |
          set -e
          mkdir -p vendor
          TMP="$(mktemp -d)"
          for f in vendor_src/*.deb; do
            echo ">>> 解包 $f"
            dpkg-deb -x "$f" "$TMP"
            find "$TMP" -name '*.dylib' -exec cp -v {} vendor/ \;
            find "$TMP" -name '*.plist' -path '*DynamicLibraries*' -exec cp -v {} vendor/ \;
          done
          echo ">>> vendor 内容:"
          ls -la vendor/
          test -f "vendor/转转找鸡.dylib"    || (echo "错误：缺少 转转找鸡.dylib"; exit 1)
          test -f "vendor/ShuiShuiZZFilter.dylib" || (echo "错误：缺少 ShuiShuiZZFilter.dylib"; exit 1)

      - name: 给原始 dylib 重新签名
        run: |
          set -e
          for d in vendor/*.dylib; do
            echo ">>> ldid -S $d"
            ldid -S "$d"
          done

      - name: 构建 deb
        run: |
          set -e
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1
          echo ">>> 产物:"
          find . -maxdepth 2 -name '*.deb' -exec ls -la {} \;

      - name: 检查 deb 内容
        run: |
          set -e
          DEB=$(find . -maxdepth 2 -name '*.deb' | head -1)
          echo ">>> deb = $DEB"
          echo "----- control -----"
          dpkg-deb -I "$DEB"
          echo "----- 文件清单 -----"
          dpkg-deb -c "$DEB"
          echo "----- dylib 架构与签名校验 -----"
          rm -rf /tmp/chk && mkdir -p /tmp/chk
          dpkg-deb -x "$DEB" /tmp/chk
          for d in /tmp/chk/Library/MobileSubstrate/DynamicLibraries/*.dylib; do
            echo "--- $(basename "$d")"
            file "$d" | sed 's/^/    /'
            if ldid -e "$d" >/dev/null 2>&1; then
              echo "    签名: OK"
            else
              echo "    签名: 缺失或未识别"
            fi
          done
          echo "----- 最终 dylib 清单（应为 3 个）-----"
          ls /tmp/chk/Library/MobileSubstrate/DynamicLibraries/

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: zzmerge-deb
          path: "*.deb"
          if-no-files-found: error
