name: Build ZZMerge deb

# ===========================================================================
# 触发：推送到 main/master，或手动 Run workflow
#
# 【构建模式】rootful（默认），刻意不设 THEOS_PACKAGE_SCHEME。
#   依据：原版找鸡的 control 写着 Pre-Depends: rootless-compat，
#   安装路径 /Library/MobileSubstrate/DynamicLibraries/ —— 它本身就是 rootful，
#   由 rootless-compat 在无根/RootHide 设备上做路径映射。照抄它最稳。
#   另：Theos 不存在名为 "roothide" 的 scheme。
#
# 【工具链】历史失败记录：
#   1. 'roothide' package scheme does not exist
#   2. You do not have any SDKs in .../theos/sdks
#   3. .../toolchain/linux/iphone/bin/clang: No such file or directory
#   4. ld: error: unknown argument '-dynamic' / '-dylib' / '-arch'
#      —— clang 是 Apple 目标，链接器却是 GNU ld
#   5.
#      (a) 我调用了 theos/bin/get-toolchain.sh —— 这个文件**根本不存在**。
#          真实脚本是 install-theos / install-sdk / swift-bootstrapper.pl。
#      (b) 我拼的下载 URL 是错的（把 git tag 前缀 llvmorg- 拼进了文件名）。
#
#   现在策略：优先用 Theos 自己的安装脚本（它们的 URL 由 Theos 维护，最可靠），
#             并保留多候选 URL 探测，**每个候选都打印 HTTP 状态码**，
#             这样失败时能一眼看出是 URL 错还是网络问题。
# ===========================================================================
on:
  workflow_dispatch:
    inputs:
      with_bridge:
        description: "是否编译并装入桥接层（选 false 则只装原版找鸡，用于排查闪退）"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot git make perl xz-utils curl ca-certificates dpkg \
            file zstd unzip zip rsync binutils
          echo ">>> 基础工具:"
          git --version; make --version | head -1; perl --version | head -2

          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "$HOME/.local/bin/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$HOME/.local/bin/ldid"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo ">>> ldid:"; "$HOME/.local/bin/ldid" -h 2>&1 | head -2 || true

      - name: 克隆 Theos（并打印其安装脚本，便于核实）
        if: ${{ github.event.inputs.with_bridge != 'false' }}
        run: |
          set -e
          rm -rf "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive --recommend-shallow \
            || echo "!!! 子模块补充失败（继续）"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo ">>> Theos 目录:"; ls "$THEOS"
          echo ">>> 可用 package scheme:"; ls "$THEOS/makefiles/package" 2>/dev/null || echo "  (无)"
          echo ">>> bin 内容:"; ls "$THEOS/bin"
          echo
          echo "=============================================================="
          echo ">>> swift-bootstrapper.pl —— 看它用什么 URL 下载工具链"
          echo "=============================================================="
          # 这是核实"正确下载地址"的最可靠办法：直接看 Theos 自己怎么写的
          grep -nE 'https?://|download|\.tar|ubuntu|RELEASE' \
            "$THEOS/bin/swift-bootstrapper.pl" 2>/dev/null | head -40 \
            || echo "(读取失败)"
          echo
          echo ">>> update-theos 里的下载相关行:"
          grep -nE 'https?://' "$THEOS/bin/update-theos" 2>/dev/null | head -20 || true
          echo
          echo ">>> install-theos 前 60 行:"
          head -60 "$THEOS/bin/install-theos" 2>/dev/null || true

      # =====================================================================
      # 编译工具链
      #   目标：$THEOS/toolchain/linux/iphone/bin 下有
      #         1) 能交叉编译到 iOS 的 clang
      #         2) Apple 兼容链接器（ld64/ld64.lld），绝不能是 GNU ld
      # =====================================================================
      - name: 安装编译工具链
        if: ${{ github.event.inputs.with_bridge != 'false' }}
        run: |
          set -uo pipefail

          TBIN="$THEOS/toolchain/linux/iphone/bin"

          ld_is_apple() {
            [ -x "$TBIN/ld" ] || return 1
            if "$TBIN/ld" -v 2>&1 | grep -qiE 'gnu ld|GNU gold'; then
              return 1
            fi
            return 0
          }
          toolchain_ok() {
            [ -x "$TBIN/clang" ] || return 1
            ld_is_apple
          }
          show_state() {
            echo "    clang -> $(readlink -f "$TBIN/clang" 2>/dev/null || echo 无)"
            "$TBIN/clang" --version 2>&1 | head -2 | sed 's/^/      /' || true
            echo "    ld    -> $(readlink -f "$TBIN/ld" 2>/dev/null || echo 无)"
            "$TBIN/ld" -v 2>&1 | head -2 | sed 's/^/      /' || true
          }
          # 探测 URL 是否可下载；打印状态码，便于判断是 URL 错还是网络问题
          try_get() {
            url="$1"; out="$2"
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "    [HTTP $code] 可下载: $url"
              curl -fsSL --retry 2 --max-time 1800 -o "$out" "$url" && return 0
              echo "    !!! 下载中断"
              return 1
            fi
            echo "    [HTTP $code] 不可用: $url"
            return 1
          }

          mkdir -p "$TBIN"
          echo ">>> [前置] 清理旧的链接器"
          rm -f "$TBIN/ld" "$TBIN/lld" "$TBIN/ld64.lld"

          # =====================================================================
          # 地址来源（全部来自实测，不再靠猜）：
          #   探测器 probe.yml 的实测结果：
          #     *.download.swift.org 的 15 种组合 → 全部 404
          #       （Theos 根本不用这个域名）
          #     clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz  → 200
          #     clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz  → 200
          #     clang+llvm-16.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz  → 200
          #     系统 /usr/bin/ld 是 GNU ld 2.42（必须避开）
          #   并且 install-theos 源码（第 437/439/461 行）明确写着 Theos 自己用：
          #     kabiroberai/swift-toolchain-linux  v2.3.0  swift-5.8-ubuntu20.04[-$ARCH].tar.xz
          #     L1ghtmann/llvm-project              iOSToolchain[-$ARCH].tar.xz
          #   所以下面优先用 Theos 自己的地址，再用实测可用的 LLVM 官方包。
          # =====================================================================
          KABI_BASE="https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0"
          LIGHT_BASE="https://github.com/L1ghtmann/llvm-project/releases/latest/download"

          # install-toolchain-archive <url> :
          #   下载并解压到 $THEOS/toolchain/（与 install-theos 第 461 行同样的做法），
          #   然后打印解出来的目录结构，便于确认工具链落在哪。
          install_toolchain_archive() {
            url="$1"
            TMPD="$(mktemp -d)"
            if ! try_get "$url" "$TMPD/tc.tar.xz"; then
              rm -rf "$TMPD"; return 1
            fi
            if ! tar -xJf "$TMPD/tc.tar.xz" -C "$THEOS/toolchain/" 2>/dev/null; then
              echo "    !!! 解压失败（可能不是 .tar.xz）"
              rm -rf "$TMPD"; return 1
            fi
            rm -rf "$TMPD"
            echo "    >>> 解压后 \$THEOS/toolchain 结构:"
            find "$THEOS/toolchain" -maxdepth 3 -type d 2>/dev/null | head -20
            return 0
          }

          # install-from-archive <root> :
          #   从已解压的 LLVM/Swift 目录里，把 clang 与 Apple 链接器链接到 $TBIN
          install_from_archive() {
            root="$1"
            echo "    >>> 在 $root 下查找 clang 与 ld64.lld:"
            c="$(find "$root" \( -name clang -o -name 'clang-*' \) -type f -perm -u+x 2>/dev/null | head -1)"
            l="$(find "$root" \( -name 'ld64.lld*' -o -name 'ld64*' \) -type f -perm -u+x 2>/dev/null | head -1)"
            echo "        clang   = ${c:-未找到}"
            echo "        ld64    = ${l:-未找到}"

            if [ -n "$c" ]; then
              ln -sfn "$c" "$TBIN/clang"
              # 同一目录下的 clang++ 一并链上
              cdir="$(dirname "$c")"
              [ -x "$cdir/clang++" ] && ln -sfn "$cdir/clang++" "$TBIN/clang++"
              for t in ar ranlib nm strip objcopy objdump install_name_tool lipo; do
                if [ -x "$cdir/$t" ]; then ln -sfn "$cdir/$t" "$TBIN/$t"
                else s="$(command -v "$t" 2>/dev/null || true)"; [ -n "$s" ] && ln -sfn "$s" "$TBIN/$t"; fi
              done
            fi
            if [ -n "$l" ]; then
              echo "        -> 采用 ld64: $l"
              ln -sfn "$l" "$TBIN/ld"
              ln -sfn "$l" "$TBIN/ld64.lld"
            fi

            # 兜底：LLVM 目录里找 ld64.lld（可能叫 ld64.lld.darwinnew 等）
            if ! ld_is_apple; then
              l2="$(find "$root" -name 'ld64.lld*' -type f 2>/dev/null | head -1)"
              if [ -n "$l2" ]; then
                echo "        -> 兜底采用 ld64: $l2"
                ln -sfn "$l2" "$TBIN/ld"; ln -sfn "$l2" "$TBIN/ld64.lld"
              fi
            fi
          }

          # =====================================================================
          # 方式顺序的依据 —— 已核对 Theos 的 install-theos 源码：
          #
          #   第 408 行：若 $THEOS/toolchain/linux/iphone 非空，则认为已装好
          #   第 412-415 行：
          #       stoolchain="n"
          #       if [[ -z $CI ]]; then read -p "支持 Swift？[y/n]" stoolchain; fi
          #       在 CI 里 CI 变量已设置，于是跳过提问，stoolchain 保持 "n"
          #   第 416 行：if theos_bool $stoolchain; then
          #   第 437 行：    装了 Swift 的工具链 kabiroberai/swift-...-ubuntu20.04.tar.xz
          #   第 461 行：否则装 L1ghtmann/llvm-project 的 iOSToolchain-$ARCH.tar.xz
          #   第 470 行：if [[ -x $THEOS/toolchain/linux/iphone/bin/clang ]]; then  ← 权威路径
          #
          # 结论：**CI 环境下 install-theos 装的是 L1ghtmann 的 iOSToolchain**，
          # 所以把它排在方式A；kabiroberai 的 Swift 版排在其后作为备选。
          # 目标路径 $THEOS/toolchain/linux/iphone/bin/clang 也与第 470 行完全一致。
          # =====================================================================

          # ---------------- 方式A：CI 下 install-theos 实际使用的工具链 ----------------
          # 已实测核实：iOSToolchain-x86_64.tar.xz 的归档顶层就是 linux/iphone/，
          # 因此 `tar -xJf - -C $THEOS/toolchain/` 会精确产出
          #     $THEOS/toolchain/linux/iphone/bin/clang
          # 与 install-theos 第 470 行的校验路径一致。
          if ! toolchain_ok; then
            echo
            echo ">>> 方式A：L1ghtmann/llvm-project iOSToolchain（CI 下 install-theos 用的就是它）"
            ARCH="$(uname -m)"
            for f in "iOSToolchain-$ARCH.tar.xz" "iOSToolchain.tar.xz"; do
              toolchain_ok && break
              echo "  --- 尝试 $f"
              install_toolchain_archive "$LIGHT_BASE/$f" || continue
              # 归档已解到 $THEOS/toolchain/，正常情况下
              # $THEOS/toolchain/linux/iphone/bin/clang 应当已存在；
              # 若内部结构与预期不同，install_from_archive 会自己找出来补链。
              if [ ! -x "$TBIN/clang" ]; then
                echo "  --- 未在预期位置找到 clang，尝试在 toolchain 下搜索补齐"
                install_from_archive "$THEOS/toolchain"
              fi
            done
            if toolchain_ok; then echo ">>> 方式A 完整可用"; show_state; fi
          fi

          # ---------------- 方式B：Swift 版工具链（install-theos 第 437/439 行）----
          if ! toolchain_ok; then
            echo
            echo ">>> 方式B：kabiroberai/swift-toolchain-linux（install-theos 第 437/439 行）"
            ARCH="$(uname -m)"
            for f in "swift-5.8-ubuntu20.04-$ARCH.tar.xz" "swift-5.8-ubuntu20.04.tar.xz"; do
              toolchain_ok && break
              echo "  --- 尝试 $f"
              install_toolchain_archive "$KABI_BASE/$f" \
                && install_from_archive "$THEOS/toolchain"
            done
            if toolchain_ok; then echo ">>> 方式B 完整可用"; show_state; fi
          fi

          # ---------------- 方式C：LLVM 官方发布包（实测可用的三组）----------------
          if ! toolchain_ok; then
            echo
            echo ">>> 方式C：LLVM 官方发布包（实测可用的组合）"
            # 注意：每版可用的 os 后缀不同（实测结果），所以按 (版本,后缀) 成对尝试
            for pair in \
              "18.1.8 ubuntu-18.04" \
              "17.0.6 ubuntu-22.04" \
              "16.0.6 ubuntu-22.04"
            do
              toolchain_ok && break
              set -- $pair
              ver="$1"; os="$2"
              url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/clang+llvm-$ver-x86_64-linux-gnu-$os.tar.xz"
              echo "  --- 尝试 $ver / $os"
              TMPD="$(mktemp -d)"
              if try_get "$url" "$TMPD/llvm.tar.xz"; then
                if tar -xJf "$TMPD/llvm.tar.xz" -C "$TMPD" 2>/dev/null; then
                  root="$(find "$TMPD" -maxdepth 2 -type d -name bin | head -1)"
                  root="$(dirname "$root")"
                  echo "    解压到: $root"
                  install_from_archive "$root"
                else
                  echo "    !!! 解压失败"
                fi
              fi
              rm -rf "$TMPD"
            done
            if toolchain_ok; then echo ">>> 方式C 完整可用"; show_state; fi
          fi

          # ---------------- 方式D：Theos 官方 install-theos（最后手段）----------------
          # 放在最后：它可能尝试完整安装 Theos 本身（含交互提示），耗时且可能改动环境。
          if ! toolchain_ok; then
            echo
            echo ">>> 方式D：$THEOS/bin/install-theos"
            if [ -x "$THEOS/bin/install-theos" ]; then
              printf '\n\n\n\n\n' > /tmp/ans.txt
              timeout 1500 bash "$THEOS/bin/install-theos" < /tmp/ans.txt 2>&1 | tail -80
              echo ">>> install-theos 退出码: ${PIPESTATUS[0]}"
              # 它把工具链解到 $THEOS/toolchain/，找出实际的 clang 位置
              echo ">>> \$THEOS/toolchain 结构:"
              find "$THEOS/toolchain" -maxdepth 4 -type d 2>/dev/null | head -20
              real_clang="$(find "$THEOS/toolchain" -name clang -type f -perm -u+x 2>/dev/null | head -1)"
              real_ld64="$(find "$THEOS/toolchain" -name 'ld64.lld*' -type f 2>/dev/null | head -1)"
              echo "    找到 clang: ${real_clang:-无}"
              echo "    找到 ld64 : ${real_ld64:-无}"
              [ -n "$real_clang" ] && ln -sfn "$real_clang" "$TBIN/clang"
              [ -n "$real_ld64" ] && { ln -sfn "$real_ld64" "$TBIN/ld"; ln -sfn "$real_ld64" "$TBIN/ld64.lld"; }
            else
              echo "!!! 不存在 $THEOS/bin/install-theos"
            fi
            if toolchain_ok; then echo ">>> 方式D 完整可用"; show_state; fi
          fi


          # ---------------- 硬校验 ----------------
          echo
          echo "=============================================================="
          echo ">>> 工具链校验"
          echo "=============================================================="
          echo "--- $TBIN ---"; ls -la "$TBIN" 2>/dev/null | head -30 || echo "  (不存在)"
          show_state || true
          if toolchain_ok; then
            echo "工具链校验通过"
          else
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "!!! 工具链不满足：需要 clang + Apple 兼容链接器(ld64/ld64.lld)。"
            echo "!!! 请把上面【方式A~D 的完整输出】发给我 —— 里面有每个候选 URL"
            echo "!!! 的 HTTP 状态码，可以直接看出是地址错还是网络受限。"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi

      # =====================================================================
      # iOS SDK
      # =====================================================================
      - name: 安装 iOS SDK
        if: ${{ github.event.inputs.with_bridge != 'false' }}
        run: |
          set -uo pipefail

          sdk_ok() {
            [ -d "$THEOS/sdks" ] && \
            [ -n "$(ls -A "$THEOS/sdks" 2>/dev/null)" ] && \
            ls "$THEOS/sdks" | grep -qi '^iPhoneOS.*\.sdk$'
          }

          sdk_ok && echo ">>> SDK 已由前面步骤装好" || true

          # ---------------- 方式A：Theos 官方 install-sdk（必须带参数！）----------------
          # install-sdk 已核对源码（60 行）：
          #   第 26-30 行：if [[ $# -ne 1 ]] 则打印 Usage 并 exit 2
          #                （我上一次就是因为没给参数，直接 exit 2 挂掉）
          #   第 45-51 行：参数 "latest" 会挑最新的 iPhoneOS*.sdk；
          #                也可直接给 "iPhoneOS16.5"
          #   第 58 行：   自行 curl 并 tar 解到 $THEOS/sdks
          #   第 54-56 行：若该 SDK 已存在则 exit 5（不算致命）
          # 它用的地址实测为 https://api.github.com/repos/theos/sdks/releases/latest
          if ! sdk_ok; then
            echo ">>> 方式A：$THEOS/bin/install-sdk latest"
            if [ -x "$THEOS/bin/install-sdk" ]; then
              set +e
              bash "$THEOS/bin/install-sdk" latest
              rc=$?
              set -e
              echo ">>> install-sdk 退出码: $rc（5 = 该 SDK 已存在，属正常）"
            else
              echo "!!! 不存在 $THEOS/bin/install-sdk"
            fi
            ls "$THEOS/sdks" 2>/dev/null | head -20 || true
          fi

          # ---------------- 方式B：直取 releases 里的 SDK 资产 ----------------
          # 实测 tag 为 master-<sha>，资产名形如 iPhoneOS16.5.sdk.tar.xz。
          # 这里不写死 sha，改为通过 API 解析出真实下载地址。
          if ! sdk_ok; then
            echo ">>> 方式B：经 GitHub API 解析并下载 iPhoneOS SDK"
            mkdir -p "$THEOS/sdks"
            TMPD="$(mktemp -d)"
            api="https://api.github.com/repos/theos/sdks/releases/latest"
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 60 "$api" || echo 000)
            echo "    [HTTP $code] $api"
            if [ "$code" = "200" ]; then
              curl -fsSL --max-time 120 -o "$TMPD/meta.json" "$api" || true
              # 优先 16.5，其次 15.6，再其次任意 iPhoneOS（取版本号最大的）
              url="$(grep -o 'https://[^"]*iPhoneOS16\.5\.sdk\.tar\.xz' "$TMPD/meta.json" | head -1)"
              [ -z "$url" ] && url="$(grep -o 'https://[^"]*iPhoneOS15\.6\.sdk\.tar\.xz' "$TMPD/meta.json" | head -1)"
              [ -z "$url" ] && url="$(grep -o 'https://[^"]*iPhoneOS[0-9.]*\.sdk\.tar\.xz' "$TMPD/meta.json" | sort -V | tail -1)"
              echo "    SDK 地址: ${url:-未解析到}"
              if [ -n "$url" ]; then
                curl -fsSL --retry 2 --max-time 1800 -o "$TMPD/sdk.tar.xz" "$url" \
                  && tar -xJf "$TMPD/sdk.tar.xz" -C "$THEOS/sdks" \
                  && echo "    解压完成"
              fi
            fi
            rm -rf "$TMPD"
            ls "$THEOS/sdks" 2>/dev/null | head -20 || true
          fi

          # ---------------- 方式C：git clone theos/sdks ----------------
          if ! sdk_ok; then
            echo ">>> 方式C：git clone theos/sdks"
            rm -rf "$THEOS/sdks"
            git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks" \
              || echo "!!! 克隆失败"
            ls "$THEOS/sdks" 2>/dev/null | head -20 || true
          fi

          # ---------------- 方式D：下载 master 归档（实测 HTTP 200）----------------
          if ! sdk_ok; then
            echo ">>> 方式D：下载 theos/sdks master 归档"
            mkdir -p "$THEOS/sdks"
            TMPD="$(mktemp -d)"
            for u in \
              "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz" \
              "https://github.com/theos/sdks/archive/refs/heads/main.tar.gz"
            do
              code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 60 "$u" || echo 000)
              echo "    [HTTP $code] $u"
              if [ "$code" = "200" ] || [ "$code" = "302" ]; then
                curl -fsSL --retry 3 --max-time 1800 -o "$TMPD/sdks.tar.gz" "$u" || continue
                if tar -xzf "$TMPD/sdks.tar.gz" -C "$TMPD"; then
                  find "$TMPD" -maxdepth 3 -name '*.sdk' -type d \
                    -exec cp -R {} "$THEOS/sdks/" \; && break
                fi
              fi
            done
            rm -rf "$TMPD"
          fi

          echo "--- \$THEOS/sdks ---"; ls -la "$THEOS/sdks" 2>/dev/null || echo "  (不存在)"
          if sdk_ok; then
            echo "SDK 校验通过"
          else
            echo "!!! 仍然没有可用 SDK，构建必然失败。"
            exit 1
          fi

      # =====================================================================
      # 链接自检：用最小 dylib 验证 clang + 链接器 + SDK 能协同工作。
      #
      # 【为什么命令要写成这样】—— 已核对 Theos 源码，不是随手写的：
      #   makefiles/targets/Linux/iphone.mk 第 14-23 行：
      #     若工具链里没有 armv7-apple-darwin11-ld / arm64-apple-darwin14-ld，
      #     则 _THEOS_TARGET_USE_CLANG_TARGET_FLAG := TRUE
      #     （L1ghtmann 工具链正是这种情况：bin 下只有无前缀的 clang/ld）
      #   makefiles/targets/_common/darwin_tail.mk 第 34-42 行：
      #     该标志为真时 VERSIONFLAGS := -target $(ARCH)-apple-ios15.0
      #     否则        VERSIONFLAGS := -miphoneos-version-min=15.0
      #     _THEOS_TARGET_LDFLAGS := -isysroot "$(SYSROOT)" $(VERSIONFLAGS) \
      #                              $(LEGACYFLAGS) -multiply_defined suppress
      #
      #   第 4 次失败时我只写了 -arch/-miphoneos-version-min，缺 -target，
      #   于是旧版 clang（clang-11）走了错误的驱动分支，把 GNU 风格的
      #   --eh-frame-hdr 传给了 ld64，报 "unknown option: --eh-frame-hdr"。
      #   所以这里必须带上 -target，与 Theos 的实际行为一致。
      # =====================================================================
      - name: 链接自检（最小 dylib，完全对齐 Theos 的调用方式）
        if: ${{ github.event.inputs.with_bridge != 'false' }}
        run: |
          set -uo pipefail
          TBIN="$THEOS/toolchain/linux/iphone/bin"
          SDK="$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -1)"
          echo ">>> SDK: $SDK"
          echo ">>> clang -> $(readlink -f "$TBIN/clang" 2>/dev/null || echo 无)"
          echo ">>> ld    -> $(readlink -f "$TBIN/ld" 2>/dev/null || echo 无)"

          TMPD="$(mktemp -d)"
          cat > "$TMPD/t.m" <<'EOF'
          #import <Foundation/Foundation.h>
          static int zz_selftest(void) { return 7; }
          EOF

          fail=0
          for arch in arm64 arm64e; do
            echo ">>> 链接 $arch"
            # 与 Theos 的 VERSIONFLAGS 一致：使用 -target 形式
            VF="-target $arch-apple-ios15.0"
            if "$TBIN/clang" -x objective-c -c "$TMPD/t.m" -o "$TMPD/t-$arch.o" \
                 -isysroot "$SDK" $VF -fobjc-arc 2>&1 | tail -5; then
              if "$TBIN/clang" -dynamiclib -isysroot "$SDK" $VF \
                   -multiply_defined suppress \
                   -framework Foundation \
                   "$TMPD/t-$arch.o" -o "$TMPD/t-$arch.dylib" 2>&1 | tail -15; then
                if [ -f "$TMPD/t-$arch.dylib" ]; then
                  echo "    $arch 链接成功 ($(stat -c%s "$TMPD/t-$arch.dylib") 字节)"
                else
                  echo "    !!! $arch 未生成产物"; fail=1
                fi
              else
                echo "    !!! $arch 链接失败"; fail=1
              fi
            else
              echo "    !!! $arch 编译失败"; fail=1
            fi
          done

          # 额外的诊断：打印 clang 实际调用的链接器命令行（便于定位）
          if [ "$fail" != "0" ]; then
            echo ">>> 诊断：-v 显示 clang 实际如何调用链接器"
            "$TBIN/clang" -### -dynamiclib -isysroot "$SDK" \
              -target arm64-apple-ios15.0 -multiply_defined suppress \
              -framework Foundation "$TMPD/t-arm64.o" -o "$TMPD/x.dylib" 2>&1 | tail -20 || true
          fi
          rm -rf "$TMPD"

          if [ "$fail" = "0" ]; then
            echo ">>> 链接自检通过"
          else
            echo "!!! 链接自检失败 —— 工具链或 SDK 有问题。"
            exit 1
          fi

      - name: 从原始 deb 中取出两个 dylib 与 plist
        run: |
          set -e
          mkdir -p vendor
          TMP="$(mktemp -d)"
          for f in vendor_src/*.deb; do
            echo ">>> 解包 $f"
            dpkg-deb -x "$f" "$TMP"
            find "$TMP" -name '*.dylib' -exec cp -v {} vendor/ \;
            find "$TMP" -name '*.plist' -path '*DynamicLibraries*' -exec cp -v {} vendor/ \;
          done
          echo ">>> vendor:"; ls -la vendor/
          test -f "vendor/转转找鸡.dylib" || (echo "缺少 转转找鸡.dylib"; exit 1)
          test -f "vendor/ShuiShuiZZFilter.dylib" || (echo "缺少 ShuiShuiZZFilter.dylib"; exit 1)

      - name: 给原始 dylib 重新签名
        run: |
          set -e
          for d in vendor/*.dylib; do echo ">>> ldid -S $d"; ldid -S "$d"; done

      - name: 构建 deb
        run: |
          set -e
          if [ "${{ github.event.inputs.with_bridge }}" = "false" ]; then
            echo "=============================================================="
            echo ">>> 本次为【排查模式】：只打包原版找鸡，不含桥接层"
            echo ">>> 用途：判断闪退是「找鸡自身/与系统冲突」还是「桥接层」引起"
            echo "=============================================================="
            # 该模式下 internal-stage:: 依然会执行（会把 vendor 里的找鸡并入
            # 打包目录），但不编译桥接源码；若 stage 目标缺失则退化为手工组装。
            make clean 2>/dev/null || true
            make stage FINALPACKAGE=1 || true
          else
            make clean 2>/dev/null || true
            make package FINALPACKAGE=1
          fi

          echo ">>> Theos 打包目录 $(pwd)/packages 内容:"
          ls -la packages/ 2>/dev/null || echo "  (packages 目录不存在)"
          echo ">>> .theos/_ 内容（staging 目录）:"
          find .theos/_ -maxdepth 4 2>/dev/null | head -30 || true
          echo ">>> 全仓库搜索 deb:"
          find . -name '*.deb' -not -path './theos/*' -exec ls -la {} \; || true

          mkdir -p dist
          found=0
          for f in packages/*.deb .theos/*.deb *.deb; do
            [ -e "$f" ] || continue
            cp -f "$f" dist/
            found=$((found + 1))
            echo ">>> 已收集: $f"
          done
          if [ "$found" -eq 0 ]; then
            echo ">>> packages/ 下没有 deb，尝试从 staging 目录手工组装（排查模式）"
            STAGE_DIR="$(ls -d .theos/_ 2>/dev/null | head -1)"
            if [ -n "$STAGE_DIR" ] && [ -d "$STAGE_DIR/Library/MobileSubstrate/DynamicLibraries" ]; then
              echo ">>> staging 内容:"; find "$STAGE_DIR" -type f | head -20
              mkdir -p dist/pack/DEBIAN
              cp -R "$STAGE_DIR"/* dist/pack/ 2>/dev/null || true
              cp control dist/pack/DEBIAN/control
              ( cd dist && dpkg-deb -b pack "com.hang.zzzj_0.0.1-9_nobridge_iphoneos-arm64.deb" )
              rm -rf dist/pack
              found=1
            fi
          fi
          if [ "$found" -eq 0 ]; then
            echo "!!! 没有找到任何 deb 产物，构建视为失败"
            exit 1
          fi
          echo ">>> dist/ 内容:"; ls -la dist/

      - name: 检查 deb 内容
        run: |
          set -e
          DEB=$(ls dist/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then
            echo "!!! dist/ 里没有 deb"
            ls -la dist/ 2>/dev/null || true
            exit 1
          fi
          echo ">>> deb = $DEB"
          echo "----- control -----"; dpkg-deb -I "$DEB"
          echo "----- 文件清单 -----"; dpkg-deb -c "$DEB"
          echo "----- dylib 校验 -----"
          rm -rf /tmp/chk && mkdir -p /tmp/chk
          dpkg-deb -x "$DEB" /tmp/chk
          DLDIR=/tmp/chk/Library/MobileSubstrate/DynamicLibraries
          for d in "$DLDIR"/*.dylib; do
            echo "--- $(basename "$d")"; file "$d" | sed 's/^/    /'
            ldid -e "$d" >/dev/null 2>&1 && echo "    签名: OK" || echo "    签名: 缺失"
          done
          echo "----- 最终清单（应为 3 个 dylib + 3 个 plist）-----"
          ls -la "$DLDIR"

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: zzmerge-deb-${{ github.event.inputs.with_bridge == 'false' && 'NOBRIDGE' || 'ADDON' }}
          # Theos 的 deb 默认生成在 $(THEOS_PROJECT_DIR)/packages/ 下，不在仓库根目录。
          # 早先写成 "*.deb" 只在根目录匹配，因此报
          #   "No files were found with the provided path: *.deb"
          # 现在构建步骤已把产物统一收集到 dist/，这里直接取 dist/*.deb。
          path: dist/*.deb
          if-no-files-found: error
